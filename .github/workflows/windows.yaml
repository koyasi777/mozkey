          function Get-PEMachine {
            param([Parameter(Mandatory)][string]$Path)

            $fs = $null
            $br = $null
            try {
              $fs = [System.IO.File]::Open(
                $Path,
                [System.IO.FileMode]::Open,
                [System.IO.FileAccess]::Read,
                [System.IO.FileShare]::ReadWrite
              )
              $br = [System.IO.BinaryReader]::new($fs)

              if ($br.ReadUInt16() -ne 0x5A4D) { return "NOT_PE" }
              $fs.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
              $offset = $br.ReadUInt32()
              $fs.Seek($offset, [System.IO.SeekOrigin]::Begin) | Out-Null
              if ($br.ReadUInt32() -ne 0x00004550) { return "INVALID_PE" }

              $machine = $br.ReadUInt16()
              switch ($machine) {
                0xAA64 { return "ARM64" }
                0x8664 { return "x64" }
                0x014c { return "x86" }
                default { return ("0x{0:X4}" -f $machine) }
              }
            }
            finally {
              if ($br) { $br.Dispose() }
              elseif ($fs) { $fs.Dispose() }
            }
          }

          function Invoke-HttpJson {
            param(
              [Parameter(Mandatory)][string]$Method,
              [Parameter(Mandatory)][string]$Url,
              [string]$ApiKey = "",
              [string]$Body = "",
              [int]$TimeoutSeconds = 60
            )

            $handler = [System.Net.Http.HttpClientHandler]::new()
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds($TimeoutSeconds)

            try {
              $request = [System.Net.Http.HttpRequestMessage]::new(
                [System.Net.Http.HttpMethod]::new($Method),
                $Url
              )
              try {
                if ($ApiKey) {
                  $request.Headers.Authorization =
                    [System.Net.Http.Headers.AuthenticationHeaderValue]::new(
                      "Bearer",
                      $ApiKey
                    )
                }

                if ($Body -and $Method -ne "GET") {
                  $request.Content = [System.Net.Http.StringContent]::new(
                    $Body,
                    [System.Text.Encoding]::UTF8,
                    "application/json"
                  )
                }

                $response = $client.SendAsync($request).GetAwaiter().GetResult()
                try {
                  $text = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                  return [pscustomobject]@{
                    StatusCode = [int]$response.StatusCode
                    Text = $text
                  }
                }
                finally {
                  $response.Dispose()
                }
              }
              finally {
                $request.Dispose()
              }
            }
            finally {
              $client.Dispose()
              $handler.Dispose()
            }
          }

          function Get-FreeTcpPort {
            $listener = [System.Net.Sockets.TcpListener]::new(
              [System.Net.IPAddress]::Loopback,
              0
            )
            $listener.Start()
            try {
              return ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            }
            finally {
              $listener.Stop()
            }
          }

          function Read-Exactly {
            param(
              [Parameter(Mandatory)][System.IO.Stream]$Stream,
              [Parameter(Mandatory)][int]$Count
            )

            $buffer = [byte[]]::new($Count)
            $offset = 0
            while ($offset -lt $Count) {
              $read = $Stream.Read($buffer, $offset, $Count - $offset)
              if ($read -le 0) {
                throw "Unexpected EOF while reading named-pipe response."
              }
              $offset += $read
            }
            return ,$buffer
          }

          function Invoke-ZenzPipeRequest {
            param(
              [Parameter(Mandatory)][string]$Prompt,
              [uint32]$Generation = 1,
              [uint32]$TimeoutMsec = 5000,
              [uint32]$MaxOutputChars = 32
            )

            $promptBytes = [System.Text.Encoding]::UTF8.GetBytes($Prompt)
            $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(
              ".",
              "mozc_zenz_scorer",
              [System.IO.Pipes.PipeDirection]::InOut,
              [System.IO.Pipes.PipeOptions]::None
            )

            try {
              $pipe.Connect(7000)

              $headerStream = [System.IO.MemoryStream]::new()
              $writer = [System.IO.BinaryWriter]::new(
                $headerStream,
                [System.Text.Encoding]::UTF8,
                $true
              )
              try {
                $writer.Write([uint32]0x315A4E5A)
                $writer.Write([uint16]1)
                $writer.Write([uint16]1)
                $writer.Write([uint32]$Generation)
                $writer.Write([uint32]$TimeoutMsec)
                $writer.Write([uint32]$MaxOutputChars)
                $writer.Write([uint32]$promptBytes.Length)
                $writer.Flush()

                $headerBytes = $headerStream.ToArray()
              }
              finally {
                $writer.Dispose()
                $headerStream.Dispose()
              }

              if ($headerBytes.Length -ne 24) {
                throw "Zenz request header length is not 24 bytes."
              }

              $pipe.Write($headerBytes, 0, $headerBytes.Length)
              $pipe.Write($promptBytes, 0, $promptBytes.Length)
              $pipe.Flush()

              $responseHeaderBytes = Read-Exactly -Stream $pipe -Count 28
              $responseHeaderStream = [System.IO.MemoryStream]::new(
                $responseHeaderBytes,
                $false
              )
              $reader = [System.IO.BinaryReader]::new(
                $responseHeaderStream,
                [System.Text.Encoding]::UTF8,
                $true
              )

              try {
                $magic = $reader.ReadUInt32()
                $version = $reader.ReadUInt16()
                $kind = $reader.ReadUInt16()
                $responseGeneration = $reader.ReadUInt32()
                $status = $reader.ReadUInt32()
                $latency = $reader.ReadUInt32()
                $valueSize = $reader.ReadUInt32()
                $debugSize = $reader.ReadUInt32()
              }
              finally {
                $reader.Dispose()
                $responseHeaderStream.Dispose()
              }

              if ($magic -ne 0x315A4E5A -or $version -ne 1 -or $kind -ne 2) {
                throw "Invalid Zenz response header."
              }
              if ($responseGeneration -ne $Generation) {
                throw "Zenz response generation mismatch."
              }
              if ($valueSize -gt 65536 -or $debugSize -gt 65536) {
                throw "Zenz response length exceeds audit limit."
              }

              $valueBytes = if ($valueSize -gt 0) {
                Read-Exactly -Stream $pipe -Count ([int]$valueSize)
              } else {
                [byte[]]::new(0)
              }

              $debugBytes = if ($debugSize -gt 0) {
                Read-Exactly -Stream $pipe -Count ([int]$debugSize)
              } else {
                [byte[]]::new(0)
              }

              return [pscustomobject]@{
                Status = $status
                LatencyMsec = $latency
                Value = [System.Text.Encoding]::UTF8.GetString($valueBytes)
                Debug = [System.Text.Encoding]::UTF8.GetString($debugBytes)
              }
            }
            finally {
              $pipe.Dispose()
            }
          }

          function Stop-InstalledZenzProcesses {
            param([string]$Root)

            foreach ($name in @("mozc_zenz_scorer", "llama-server")) {
              foreach ($p in @(Get-Process $name -ErrorAction SilentlyContinue)) {
                $path = ""
                try { $path = $p.Path } catch {}
                if ($path -and $path.StartsWith(
                    $Root,
                    [System.StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                }
              }
            }
            Start-Sleep -Seconds 2
          }

          $installed = $false
          $directServer = $null
          $scorerProcess = $null
          $directResult = "NOT_RUN"
          $pipeResult = "NOT_RUN"
          $uninstallResult = "NOT_RUN"

          try {
            Write-Host ""
            Write-Host "===== INSTALL EXACT ARM64 MSI ====="

            $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              "/i",
              "`"$msi`"",
              "/qn",
              "/norestart",
              "/l*v",
              "`"$installLog`""
            )

            Write-Host "msiexec install exit = $($install.ExitCode)"
            if ($install.ExitCode -notin @(0, 3010)) {
              throw "ARM64 MSI installation failed with exit code $($install.ExitCode)"
            }
            $installed = $true

            Write-Host ""
            Write-Host "===== RESOLVE ACTUAL MSI INSTALL DIRECTORY ====="

            $candidateRows = @()
            $matchingDirs = @()

            foreach ($candidate in $installCandidates) {
              $llamaCandidate = Join-Path $candidate "llama-server.exe"
              $scorerCandidate = Join-Path $candidate "mozc_zenz_scorer.exe"
              $modelCandidate = Join-Path $candidate "models\zenz-v3.2-small-Q5_K_M.gguf"

              $row = [pscustomobject]@{
                Directory = $candidate
                DirectoryExists = (Test-Path $candidate -PathType Container)
                LlamaExists = (Test-Path $llamaCandidate -PathType Leaf)
                ScorerExists = (Test-Path $scorerCandidate -PathType Leaf)
                ModelExists = (Test-Path $modelCandidate -PathType Leaf)
              }
              $candidateRows += $row

              if ($row.DirectoryExists -and
                  $row.LlamaExists -and
                  $row.ScorerExists -and
                  $row.ModelExists) {
                $matchingDirs += $candidate
              }
            }

            $candidateRows |
              Format-Table -AutoSize |
              Out-String |
              Write-Host

            $candidateRows |
              Export-Csv (Join-Path $evidence "install-location-candidates.csv") `
                -NoTypeInformation -Encoding utf8

            $msiFolderLines = @(
              Select-String -Path $installLog `
                -Pattern "ProgramFilesFolder|ProgramFiles64Folder|MozcDir" `
                -ErrorAction SilentlyContinue |
                ForEach-Object { $_.Line }
            )
            $msiFolderLines |
              Set-Content (Join-Path $evidence "install-folder-properties.txt") `
                -Encoding utf8

            if ($matchingDirs.Count -ne 1) {
              Write-Host "Matching installed Mozc directories = $($matchingDirs.Count)"
              $matchingDirs | ForEach-Object { Write-Host "  $_" }
              throw "Could not resolve exactly one installed Mozc directory from MSI payload identity."
            }

            $installDir = $matchingDirs[0]
            Write-Host "Resolved install directory = $installDir"

            $llama = Join-Path $installDir "llama-server.exe"
            $scorer = Join-Path $installDir "mozc_zenz_scorer.exe"
            $model = Join-Path $installDir "models\zenz-v3.2-small-Q5_K_M.gguf"

            foreach ($path in @($llama, $scorer, $model)) {
              if (-not (Test-Path $path -PathType Leaf)) {
                throw "Required installed Zenz file missing: $path"
              }
            }

            $llamaSha = (Get-FileHash $llama -Algorithm SHA256).Hash
            $modelSha = (Get-FileHash $model -Algorithm SHA256).Hash
            $scorerSha = (Get-FileHash $scorer -Algorithm SHA256).Hash
            $llamaArch = Get-PEMachine $llama
            $scorerArch = Get-PEMachine $scorer

            Write-Host ""
            Write-Host "===== INSTALLED PAYLOAD IDENTITY ====="
            Write-Host "Install dir          = $installDir"
            Write-Host "llama PE             = $llamaArch"
            Write-Host "llama SHA256         = $llamaSha"
            Write-Host "scorer PE            = $scorerArch"
            Write-Host "scorer SHA256        = $scorerSha"
            Write-Host "model SHA256         = $modelSha"

            if ($llamaArch -ne "ARM64") {
              throw "Installed llama-server is not native ARM64."
            }
            if ($scorerArch -ne "ARM64") {
              throw "Installed mozc_zenz_scorer is not native ARM64."
            }
            if ($llamaSha -ne $env:EXPECTED_LLAMA_SHA256) {
              throw "Installed llama-server hash does not match W1/W3 contract."
            }
            if ($modelSha -ne $env:EXPECTED_MODEL_SHA256) {
              throw "Installed model hash does not match W1/W3 contract."
            }

            foreach ($legacy in @(
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "llama.dll"
            )) {
              if (Test-Path (Join-Path $installDir $legacy)) {
                throw "Legacy llama/ggml DLL was installed: $legacy"
              }
            }

            foreach ($crt in @("MSVCP140.dll", "VCRUNTIME140.dll")) {
              if (-not (Test-Path (Join-Path $installDir $crt))) {
                throw "Required app-local VC runtime DLL missing: $crt"
              }
            }

            Write-Host ""
            Write-Host "===== INSTALLED FIREWALL RULE AUDIT ====="
            $firewallRows = @()
            foreach ($spec in $expectedFirewallRules) {
              $rules = @(Get-NetFirewallRule -DisplayName $spec.Name -ErrorAction SilentlyContinue)
              if ($rules.Count -ne 1) {
                throw "Expected exactly one firewall rule '$($spec.Name)'; found $($rules.Count)"
              }
              $rule = $rules[0]
              $filters = @($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop)
              if ($filters.Count -ne 1) {
                throw "Expected exactly one application filter for '$($spec.Name)'"
              }

              $expectedProgram = [System.IO.Path]::GetFullPath((Join-Path $installDir $spec.File))
              $actualProgram = [System.IO.Path]::GetFullPath(
                [Environment]::ExpandEnvironmentVariables([string]$filters[0].Program)
              )
              $programExact = $actualProgram.Equals(
                $expectedProgram,
                [System.StringComparison]::OrdinalIgnoreCase
              )

              $firewallRows += [pscustomobject]@{
                Name = $spec.Name
                File = $spec.File
                Program = $actualProgram
                ExpectedProgram = $expectedProgram
                ProgramExact = $programExact
                Enabled = [string]$rule.Enabled
                Direction = [string]$rule.Direction
                Action = [string]$rule.Action
              }

              if (-not $programExact) {
                throw "Firewall program mismatch: $($spec.Name)"
              }
              if ([string]$rule.Enabled -ne "True") {
                throw "Firewall rule not enabled: $($spec.Name)"
              }
              if ([string]$rule.Direction -ne "Outbound") {
                throw "Firewall rule not outbound: $($spec.Name)"
              }
              if ([string]$rule.Action -ne "Block") {
                throw "Firewall rule not blocking: $($spec.Name)"
              }
            }

            $firewallRows |
              Export-Csv (Join-Path $evidence "firewall-rules-installed.csv") `
                -NoTypeInformation -Encoding utf8
            Write-Host "Installed outbound block rules = 7/7 PASS"

            Write-Host ""
            Write-Host "===== NATIVE --version SMOKE ====="

            $versionOut = Join-Path $evidence "llama-version.stdout.txt"
            $versionErr = Join-Path $evidence "llama-version.stderr.txt"
            $versionProcess = Start-Process $llama -Wait -PassThru -NoNewWindow `
              -ArgumentList @("--version") `
              -RedirectStandardOutput $versionOut `
              -RedirectStandardError $versionErr

            Write-Host "llama-server --version exit = $($versionProcess.ExitCode)"
            if ($versionProcess.ExitCode -ne 0) {
              throw "Installed ARM64 llama-server --version failed."
            }

            Write-Host ""
            Write-Host "===== DIRECT INSTALLED LLAMA SEMANTIC GATE ====="

            $port = Get-FreeTcpPort
            $apiKey = "mozkey-w4-" + [guid]::NewGuid().ToString("N")
            $directStdout = Join-Path $evidence "direct-llama.stdout.log"
            $directStderr = Join-Path $evidence "direct-llama.stderr.log"

            $directServer = Start-Process $llama -PassThru -WindowStyle Hidden `
              -ArgumentList @(
                "-m", "`"$model`"",
                "-c", "256",
                "-t", "4",
                "--parallel", "1",
                "--host", "127.0.0.1",
                "--port", "$port",
                "--api-key", $apiKey
              ) `
              -RedirectStandardOutput $directStdout `
              -RedirectStandardError $directStderr

            $ready = $false
            $watch = [Diagnostics.Stopwatch]::StartNew()
            while ($watch.Elapsed.TotalSeconds -lt 180) {
              if ($directServer.HasExited) {
                throw "Installed llama-server exited during startup: $($directServer.ExitCode)"
              }
              try {
                $health = Invoke-HttpJson `
                  -Method "GET" `
                  -Url "http://127.0.0.1:$port/health" `
                  -TimeoutSeconds 5
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
              catch {}
              Start-Sleep -Milliseconds 300
            }

            if (-not $ready) {
              throw "Installed native ARM64 llama-server did not become healthy."
            }

            $unauthPrompt =
              [string][char]0xEE02 +
              [string][char]0xEE00 +
              "ニホンゴ" +
              [string][char]0xEE01

            $unauthBody = @{
              prompt = $unauthPrompt
              n_predict = 1
              temperature = 0.0
            } | ConvertTo-Json -Compress

            $unauth = Invoke-HttpJson `
              -Method "POST" `
              -Url "http://127.0.0.1:$port/completion" `
              -Body $unauthBody `
              -TimeoutSeconds 30

            if ($unauth.StatusCode -ne 401) {
              throw "Installed llama-server API-key enforcement failed."
            }

            $vectors = @(
              [pscustomobject]@{Name="weather"; Context=""; Kana="キョウハイイテンキデスネ"; Expected="今日はいい天気で"},
              [pscustomobject]@{Name="dentist"; Context="歯が痛いので"; Kana="ハイシャ"; Expected="歯医者"},
              [pscustomobject]@{Name="scrap_car"; Context="車が壊れたので"; Kana="ハイシャ"; Expected="廃車"},
              [pscustomobject]@{Name="japanese_input"; Context=""; Kana="ニホンゴニュウリョク"; Expected="日本語入力"},
              [pscustomobject]@{Name="meeting"; Context="会議の資料を"; Kana="カクニンシマシタ"; Expected="確認しました"},
              [pscustomobject]@{Name="github"; Context="GitHubのPRを"; Kana="マージシマシタ"; Expected="マージしました"},
              [pscustomobject]@{Name="consult"; Context="体調について医師に"; Kana="ソウダンシマシタ"; Expected="相談しました"},
              [pscustomobject]@{Name="rain"; Context="今日は"; Kana="アメデス"; Expected="雨です"},
              [pscustomobject]@{Name="enemy"; Context="彼は"; Kana="テンテキデス"; Expected="天敵です"},
              [pscustomobject]@{Name="forecast"; Context="明日の"; Kana="テンキヨホウ"; Expected="天気予報"},
              [pscustomobject]@{Name="bridge"; Context="橋を渡って"; Kana="ハシノムコウヘイク"; Expected="橋の向こうへ行く"},
              [pscustomobject]@{Name="local_llm"; Context=""; Kana="ローカルエルエルエムデニホンゴヘンカン"; Expected="lawからllm"}
            )

            $contextMarker = [string][char]0xEE02
            $inputStart = [string][char]0xEE00
            $outputStart = [string][char]0xEE01
            $directRows = @()

            foreach ($v in $vectors) {
              $prompt = $contextMarker + $v.Context + $inputStart + $v.Kana + $outputStart

              $body = [ordered]@{
                prompt = $prompt
                n_predict = 8
                temperature = 0.0
                top_k = 1
                top_p = 1.0
                stream = $false
                cache_prompt = $true
                stop = @(
                  [string][char]0xEE00,[string][char]0xEE01,
                  [string][char]0xEE02,[string][char]0xEE03,
                  [string][char]0xEE04,[string][char]0xEE05,
                  [string][char]0xEE06,[string][char]0xEE07,
                  [string][char]0xEE08,[string][char]0xEE09,
                  [string][char]0xEE0A,[string][char]0xEE0B,
                  [string][char]0xEE0C,[string][char]0xEE0D,
                  [string][char]0xEE0E,[string][char]0xEE0F,
                  "`n","`r"
                )
              } | ConvertTo-Json -Compress

              $response = Invoke-HttpJson `
                -Method "POST" `
                -Url "http://127.0.0.1:$port/completion" `
                -ApiKey $apiKey `
                -Body $body `
                -TimeoutSeconds 60

              if ($response.StatusCode -ne 200) {
                throw "$($v.Name) direct completion HTTP=$($response.StatusCode)"
              }

              $json = $response.Text | ConvertFrom-Json
              $actual = [string]$json.content
              $pass = $actual -ceq $v.Expected

              Write-Host ("{0,-14} content={1} [{2}]" -f $v.Name, $pass, $actual)

              $directRows += [pscustomobject]@{
                Test = $v.Name
                Expected = $v.Expected
                Actual = $actual
                Pass = $pass
              }
            }

            $directRows |
              Export-Csv (Join-Path $evidence "direct-semantic.csv") `
                -NoTypeInformation -Encoding utf8

            $directPass = @($directRows | Where-Object Pass).Count
            if ($directPass -ne 12) {
              throw "Installed direct llama semantic gate failed: $directPass/12"
            }
            $directResult = "PASS 12/12"

            Stop-Process -Id $directServer.Id -Force -ErrorAction SilentlyContinue
            $directServer.WaitForExit()
            $directServer = $null
            Start-Sleep -Seconds 2

            Write-Host ""
            Write-Host "===== INSTALLED SCORER NAMED-PIPE E2E ====="

            $scorerStdout = Join-Path $evidence "scorer.stdout.log"
            $scorerStderr = Join-Path $evidence "scorer.stderr.log"

            $scorerProcess = Start-Process $scorer -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $scorerStdout `
              -RedirectStandardError $scorerStderr

            $pipeVectors = @(
              [pscustomobject]@{
                Name="dentist"
                Prompt=$contextMarker+"歯が痛いので"+$inputStart+"ハイシャ"+$outputStart
                Expected="歯医者"
              },
              [pscustomobject]@{
                Name="scrap_car"
                Prompt=$contextMarker+"車が壊れたので"+$inputStart+"ハイシャ"+$outputStart
                Expected="廃車"
              }
            )

            $pipeRows = @()
            $generation = [uint32]100

            foreach ($v in $pipeVectors) {
              $success = $false
              $last = $null

              for ($attempt = 1; $attempt -le 12; $attempt++) {
                if ($scorerProcess.HasExited) {
                  throw "Installed scorer exited unexpectedly: $($scorerProcess.ExitCode)"
                }

                try {
                  $generation++
                  $last = Invoke-ZenzPipeRequest `
                    -Prompt $v.Prompt `
                    -Generation $generation `
                    -TimeoutMsec 5000 `
                    -MaxOutputChars 32

                  if ($last.Status -eq 0 -and $last.Value -ceq $v.Expected) {
                    $success = $true
                    break
                  }
                }
                catch {
                  $last = [pscustomobject]@{
                    Status = 999
                    LatencyMsec = 0
                    Value = ""
                    Debug = $_.Exception.Message
                  }
                }

                Start-Sleep -Seconds 2
              }

              $actualValue = if ($last) { [string]$last.Value } else { "" }
              $statusValue = if ($last) { [int]$last.Status } else { -1 }
              $debugValue = if ($last) { [string]$last.Debug } else { "" }

              Write-Host (
                "{0,-14} status={1} pass={2} value=[{3}] debug=[{4}]" -f
                $v.Name,
                $statusValue,
                $success,
                $actualValue,
                $debugValue
              )

              $pipeRows += [pscustomobject]@{
                Test = $v.Name
                Status = $statusValue
                Expected = $v.Expected
                Actual = $actualValue
                Debug = $debugValue
                Pass = $success
              }

              if (-not $success) {
                throw "Installed scorer named-pipe E2E failed for $($v.Name)"
              }
            }

            $pipeRows |
              Export-Csv (Join-Path $evidence "scorer-pipe-e2e.csv") `
                -NoTypeInformation -Encoding utf8

            $llamaProcesses = @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -eq "llama-server.exe" -and
                  $_.ExecutablePath -and
                  $_.ExecutablePath.StartsWith(
                    $installDir,
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                }
            )

            if ($llamaProcesses.Count -ne 1) {
              throw "Expected exactly one scorer-owned installed llama-server; found $($llamaProcesses.Count)"
            }

            $scorerLlama = $llamaProcesses[0]
            $cmdLine = [string]$scorerLlama.CommandLine

            $parallelOne = $cmdLine.Contains("--parallel 1")
            $loopbackHost = $cmdLine.Contains("--host 127.0.0.1")
            $installedModelArg = $cmdLine.Contains($model)
            $hasApiKey = $cmdLine.Contains("--api-key")

            Write-Host "scorer llama --parallel 1     = $parallelOne"
            Write-Host "scorer llama loopback host    = $loopbackHost"
            Write-Host "scorer llama installed model  = $installedModelArg"
            Write-Host "scorer llama API key argument = $hasApiKey"

            if (-not $parallelOne -or -not $loopbackHost -or
                -not $installedModelArg -or -not $hasApiKey) {
              throw "Installed scorer launched llama-server with an unexpected command contract."
            }

            $listeners = @(
              Get-NetTCPConnection -State Listen -OwningProcess $scorerLlama.ProcessId `
                -ErrorAction SilentlyContinue
            )
            if ($listeners.Count -lt 1) {
              throw "Scorer-owned llama-server has no listening socket."
            }

            $nonLoopback = @(
              $listeners | Where-Object {
                $_.LocalAddress -notin @("127.0.0.1", "::1")
              }
            )
            if ($nonLoopback.Count -ne 0) {
              throw "Scorer-owned llama-server is listening beyond loopback."
            }

            Write-Host ""
            Write-Host "===== ZENZ PROCESS CONNECTION AUDIT ====="
            $zenzProcessIds = @(
              [uint32]$scorerProcess.Id
              [uint32]$scorerLlama.ProcessId
            )
            $zenzConnections = @(
              Get-NetTCPConnection -ErrorAction SilentlyContinue |
                Where-Object { $zenzProcessIds -contains [uint32]$_.OwningProcess }
            )

            $zenzConnections |
              Select-Object State, LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess |
              Export-Csv (Join-Path $evidence "zenz-tcp-connections.csv") `
                -NoTypeInformation -Encoding utf8

            $externalConnections = @(
              $zenzConnections |
                Where-Object {
                  $_.State -ne "Listen" -and
                  $_.State -ne "Bound" -and
                  $_.RemoteAddress -and
                  $_.RemoteAddress -notin @("127.0.0.1","::1","::ffff:127.0.0.1")
                }
            )
            if ($externalConnections.Count -ne 0) {
              $externalConnections | Format-Table -AutoSize | Out-String | Write-Host
              throw "Zenz runtime has a non-loopback TCP connection."
            }
            Write-Host "Zenz non-loopback TCP connections = NONE"

            $pipeResult = "PASS 2/2"

            $summaryLines = @(
              "runner_architecture=$env:PROCESSOR_ARCHITECTURE"
              "msi_sha256=$msiSha"
              "install_dir=$installDir"
              "llama_arch=$llamaArch"
              "llama_sha256=$llamaSha"
              "scorer_arch=$scorerArch"
              "scorer_sha256=$scorerSha"
              "model_sha256=$modelSha"
              "legacy_runtime_absent=true"
              "direct_semantic=$directResult"
              "scorer_pipe_e2e=$pipeResult"
              "scorer_parallel_1=$parallelOne"
              "scorer_loopback=$loopbackHost"
              "scorer_installed_model=$installedModelArg"
              "scorer_api_key_arg=$hasApiKey"
              "firewall_rules_installed=7/7"
              "zenz_non_loopback_tcp_connections=0"
            )
            $summaryLines | Set-Content $summary -Encoding utf8

            Write-Host ""
            Write-Host "===== W4 NATIVE INSTALLED MSI RESULT ====="
            Write-Host "Runner architecture             = ARM64"
            Write-Host "MSI install                      = PASS"
            Write-Host "Installed llama PE               = ARM64"
            Write-Host "Installed llama SHA256 exact     = True"
            Write-Host "Installed scorer PE              = ARM64"
            Write-Host "Installed model SHA256 exact     = True"
            Write-Host "Legacy ggml/llama DLLs           = ABSENT"
            Write-Host "Installed llama --version        = PASS"
            Write-Host "Direct installed semantic gate   = $directResult"
            Write-Host "API-key enforcement              = PASS"
            Write-Host "Installed scorer pipe E2E        = $pipeResult"
            Write-Host "Scorer --parallel 1              = PASS"
            Write-Host "Scorer loopback-only listener    = PASS"
            Write-Host "Firewall outbound block rules    = PASS 7/7"
            Write-Host "Zenz non-loopback TCP connection = NONE"
            Write-Host "W4 native installed MSI gate     = PASS"
            Write-Host "W5 installed offline gate        = PASS (pre-uninstall)"
          }
          finally {
            if ($directServer -and -not $directServer.HasExited) {
              Stop-Process -Id $directServer.Id -Force -ErrorAction SilentlyContinue
            }
            if ($scorerProcess -and -not $scorerProcess.HasExited) {
              Stop-Process -Id $scorerProcess.Id -Force -ErrorAction SilentlyContinue
            }

            if ($installDir -and (Test-Path $installDir)) {
              Stop-InstalledZenzProcesses -Root $installDir
            }

            if ($installed) {
              Write-Host ""
              Write-Host "===== UNINSTALL EXACT ARM64 MSI ====="

              $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
                "/x",
                "`"$msi`"",
                "/qn",
                "/norestart",
                "/l*v",
                "`"$uninstallLog`""
              )

              Write-Host "msiexec uninstall exit = $($uninstall.ExitCode)"
              if ($uninstall.ExitCode -in @(0, 3010)) {
                $uninstallResult = "PASS"
              } else {
                $uninstallResult = "FAIL:$($uninstall.ExitCode)"
              }

              if (Test-Path $summary) {
                Add-Content $summary "uninstall=$uninstallResult" -Encoding utf8
              }

              if ($installDir) {
                foreach ($zenzPath in @(
                  (Join-Path $installDir "llama-server.exe"),
                  (Join-Path $installDir "mozc_zenz_scorer.exe"),
                  (Join-Path $installDir "models\zenz-v3.2-small-Q5_K_M.gguf")
                )) {
                  if (Test-Path $zenzPath) {
                    Write-Error "Installed Zenz payload remains after uninstall: $zenzPath"
                  }
                }
              } else {
                Write-Host "Install directory was not resolved; payload cleanup paths cannot be checked."
              }

              Write-Host ""
              Write-Host "===== POST-UNINSTALL FIREWALL CLEANUP ====="
              $remainingFirewallRules = @()
              foreach ($spec in $expectedFirewallRules) {
                $remaining = @(Get-NetFirewallRule -DisplayName $spec.Name -ErrorAction SilentlyContinue)
                if ($remaining.Count -ne 0) {
                  $remainingFirewallRules += $spec.Name
                }
              }

              if ($remainingFirewallRules.Count -ne 0) {
                $remainingFirewallRules |
                  Set-Content (Join-Path $evidence "firewall-rules-remaining.txt") `
                    -Encoding utf8
                Write-Error (
                  "Mozc firewall rules remain after uninstall: " +
                  ($remainingFirewallRules -join ", ")
                )
              }

              Write-Host "Firewall rules remaining after uninstall = $($remainingFirewallRules.Count)"
              if (Test-Path $summary) {
                Add-Content $summary `
                  "firewall_rules_removed=$($remainingFirewallRules.Count -eq 0)" `
                  -Encoding utf8
              }

              if ($uninstallResult -ne "PASS") {
                Write-Error "ARM64 MSI uninstall failed: $uninstallResult"
              }
              if ($remainingFirewallRules.Count -eq 0) {
                Write-Host "W5 firewall uninstall cleanup = PASS"
              }
            }
          }

      - name: Upload native installed-MSI audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_native_installed_msi_audit
          path: ${{ runner.temp }}\mozkey-w4-arm64-msi-evidence
          if-no-files-found: warn
  test_arm64_tip_client_architecture:
    name: ARM64 TIP client-architecture smoke
    needs: build_arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Build native ARM64 and x64 TIP client smoke helpers
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build //win32/tip:tip_client_smoke_arm64 //win32/tip:tip_client_smoke_x64

      - name: Resolve, stage, and verify helper PE architectures
        shell: pwsh
        working-directory: .\src
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Get-PEMachine {
            param([Parameter(Mandatory = $true)][string]$Path)

            $stream = [System.IO.File]::Open(
              $Path,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Read,
              [System.IO.FileShare]::Read
            )
            try {
              $reader = New-Object System.IO.BinaryReader($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "Not an MZ executable: $Path"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadUInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Missing PE signature: $Path"
              }
              $machine = $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }

            switch ($machine) {
              0xAA64 { return "ARM64" }
              0x8664 { return "x64" }
              0x014C { return "x86" }
              default { return ("0x{0:X4}" -f $machine) }
            }
          }

          function Resolve-BazelOutput {
            param(
              [Parameter(Mandatory = $true)][string]$Target,
              [Parameter(Mandatory = $true)][string]$ExpectedFileName,
              [Parameter(Mandatory = $true)][string]$ExecutionRoot
            )

            $outputs = @(
              & bazelisk cquery --config release_build --output=files $Target |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            if ($LASTEXITCODE -ne 0) {
              throw "bazelisk cquery failed for $Target with exit code $LASTEXITCODE"
            }

            Write-Host "cquery outputs for ${Target}:"
            $outputs | ForEach-Object { Write-Host "  $_" }

            $matching = @(
              $outputs |
                Where-Object {
                  [System.IO.Path]::GetFileName($_) -ieq $ExpectedFileName
                }
            )
            if ($matching.Count -ne 1) {
              throw (
                "Expected exactly one $ExpectedFileName output for $Target; " +
                "found $($matching.Count)"
              )
            }

            $resolved = Join-Path $ExecutionRoot $matching[0]
            if (-not (Test-Path $resolved -PathType Leaf)) {
              throw "Resolved Bazel output does not exist: $resolved"
            }

            return (Resolve-Path $resolved).Path
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job is not running on native Windows ARM64."
          }

          $executionRootOutput = @(
            & bazelisk info --config release_build execution_root
          )
          if ($LASTEXITCODE -ne 0) {
            throw "bazelisk info execution_root failed with exit code $LASTEXITCODE"
          }

          Write-Host "bazelisk info execution_root raw output:"
          $executionRootOutput | ForEach-Object { Write-Host "  $_" }

          $executionRootCandidates = @(
            $executionRootOutput |
              ForEach-Object { ([string]$_).Trim() } |
              Where-Object {
                -not [string]::IsNullOrWhiteSpace($_) -and
                (Test-Path $_ -PathType Container)
              }
          )

          if ($executionRootCandidates.Count -ne 1) {
            throw (
              "Expected exactly one existing execution_root directory; " +
              "found $($executionRootCandidates.Count)"
            )
          }

          $executionRoot = [string]$executionRootCandidates[0]
          Write-Host "Bazel execution_root = $executionRoot"

          $armSource = Resolve-BazelOutput `
            -Target "//win32/tip:tip_client_smoke_arm64" `
            -ExpectedFileName "tip_client_smoke_arm64.exe" `
            -ExecutionRoot $executionRoot

          $x64Source = Resolve-BazelOutput `
            -Target "//win32/tip:tip_client_smoke_x64" `
            -ExpectedFileName "tip_client_smoke_x64.exe" `
            -ExecutionRoot $executionRoot

          $stage = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-smoke"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $armHelper = Join-Path $stage "tip_client_smoke_arm64.exe"
          $x64Helper = Join-Path $stage "tip_client_smoke_x64.exe"

          Copy-Item $armSource $armHelper -Force
          Copy-Item $x64Source $x64Helper -Force

          $armMachine = Get-PEMachine $armHelper
          $x64Machine = Get-PEMachine $x64Helper

          Write-Host "ARM64 source  = $armSource"
          Write-Host "ARM64 staged  = $armHelper"
          Write-Host "ARM64 machine = $armMachine"
          Write-Host "x64 source    = $x64Source"
          Write-Host "x64 staged    = $x64Helper"
          Write-Host "x64 machine   = $x64Machine"

          if ($armMachine -ne "ARM64") {
            throw "Native helper is not ARM64."
          }
          if ($x64Machine -ne "x64") {
            throw "Cross-built helper is not x64."
          }

      - name: Download exact ARM64 MSI from this workflow run
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64.msi
          path: ${{ runner.temp }}\mozkey-tip-smoke-msi

      - name: Install MSI and audit TIP client architecture routing
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $evidence = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-architecture-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $msiCandidates = @(
            Get-ChildItem (Join-Path $env:RUNNER_TEMP "mozkey-tip-smoke-msi") `
              -Recurse -File -Filter *.msi
          )
          if ($msiCandidates.Count -ne 1) {
            throw "Expected exactly one ARM64 MSI artifact; found $($msiCandidates.Count)"
          }
          $msi = $msiCandidates[0].FullName

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job is not running on native Windows ARM64."
          }

          $installLog = Join-Path $evidence "install.log"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i",
            "`"$msi`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$installLog`""
          )
          Write-Host "msiexec install exit = $($install.ExitCode)"
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "ARM64 MSI install failed: $($install.ExitCode)"
          }

          $clsid = "{10A67BC8-22FA-4A59-90DC-2546652C56BF}"
          $subkey = "CLSID\$clsid\InProcServer32"

          function Get-ComRegistration {
            param(
              [Parameter(Mandatory = $true)]
              [Microsoft.Win32.RegistryView]$View
            )

            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::ClassesRoot,
              $View
            )
            try {
              $key = $base.OpenSubKey($subkey, $false)
              if ($null -eq $key) {
                throw "COM registration not found in registry view $View`: $subkey"
              }
              try {
                return [pscustomobject]@{
                  View = [string]$View
                  Server = [string]$key.GetValue("")
                  ThreadingModel = [string]$key.GetValue("ThreadingModel")
                }
              } finally {
                $key.Dispose()
              }
            } finally {
              $base.Dispose()
            }
          }

          $reg64 = Get-ComRegistration `
            -View ([Microsoft.Win32.RegistryView]::Registry64)
          $reg32 = Get-ComRegistration `
            -View ([Microsoft.Win32.RegistryView]::Registry32)

          @($reg64, $reg32) |
            Export-Csv (Join-Path $evidence "com-registration.csv") `
              -NoTypeInformation -Encoding utf8

          Write-Host "64-bit COM server = $($reg64.Server)"
          Write-Host "32-bit COM server = $($reg32.Server)"

          if ([System.IO.Path]::GetFileName($reg64.Server) -ine "mozc_tip64x.dll") {
            throw "64-bit ARM64 COM registration does not point to mozc_tip64x.dll."
          }
          if ([System.IO.Path]::GetFileName($reg32.Server) -ine "mozc_tip32.dll") {
            throw "32-bit COM registration does not point to mozc_tip32.dll."
          }
          if ($reg64.ThreadingModel -ine "Apartment") {
            throw "64-bit TIP ThreadingModel is not Apartment."
          }
          if ($reg32.ThreadingModel -ine "Apartment") {
            throw "32-bit TIP ThreadingModel is not Apartment."
          }

          $stage = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-smoke"
          $armHelper = Join-Path $stage "tip_client_smoke_arm64.exe"
          $x64Helper = Join-Path $stage "tip_client_smoke_x64.exe"

          $armLog = Join-Path $evidence "arm64-helper.log"
          & $armHelper *> $armLog
          $armExit = $LASTEXITCODE
          Get-Content $armLog | ForEach-Object { Write-Host $_ }
          if ($armExit -ne 0) {
            throw "Native ARM64 TIP client smoke failed: $armExit"
          }

          $x64Log = Join-Path $evidence "x64-helper.log"
          & $x64Helper *> $x64Log
          $x64Exit = $LASTEXITCODE
          Get-Content $x64Log | ForEach-Object { Write-Host $_ }
          if ($x64Exit -ne 0) {
            throw "x64-emulated TIP client smoke failed: $x64Exit"
          }

          @(
            "runner_arch=$env:PROCESSOR_ARCHITECTURE"
            "msi=$msi"
            "msi_sha256=$((Get-FileHash $msi -Algorithm SHA256).Hash)"
            "registry64_server=$($reg64.Server)"
            "registry32_server=$($reg32.Server)"
            "arm64_helper_exit=$armExit"
            "x64_helper_exit=$x64Exit"
            "TIP_CLIENT_ARCHITECTURE_SMOKE=PASS"
          ) | Set-Content (Join-Path $evidence "summary.txt") -Encoding utf8

      - name: Uninstall exact ARM64 MSI
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Continue"

          $evidence = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-architecture-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $uninstallLog = Join-Path $evidence "uninstall.log"

          $msiCandidates = @(
            Get-ChildItem (Join-Path $env:RUNNER_TEMP "mozkey-tip-smoke-msi") `
              -Recurse -File -Filter *.msi -ErrorAction SilentlyContinue
          )

          if ($msiCandidates.Count -eq 0) {
            Write-Host "No MSI available for cleanup."
            exit 0
          }
          if ($msiCandidates.Count -ne 1) {
            Write-Error "Cleanup expected one MSI; found $($msiCandidates.Count)"
            exit 1
          }

          $msi = $msiCandidates[0].FullName
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x",
            "`"$msi`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$uninstallLog`""
          )
          Write-Host "msiexec uninstall exit = $($uninstall.ExitCode)"

          if ($uninstall.ExitCode -notin @(0, 1605, 3010)) {
            Write-Error "ARM64 MSI cleanup failed: $($uninstall.ExitCode)"
            exit 1
          }

      - name: Upload TIP client-architecture smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_tip_client_architecture_smoke
          path: ${{ runner.temp }}\mozkey-tip-client-architecture-evidence
          if-no-files-found: warn
          retention-days: 7

  test:
    needs: prepare_daily_dictionary
