name: CI for Windows
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md

# Run on push.
on: push

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_daily_dictionary:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Prepare daily dictionary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\prepare_daily_dictionary.ps1

      - name: upload daily dictionary
        uses: actions/upload-artifact@v6
        with:
          name: daily-dictionary
          path: |
            src/data/dictionary_koyasi/generated/**
            dist/dictionary/**
          if-no-files-found: error

  build_x64:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@v6
        with:
          name: daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Prepare CRT redist directory expected by WiX
        shell: pwsh
        run: |
          $expectedDir = "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"

          $requiredDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\17",
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\17",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          ) | Where-Object { Test-Path $_ }

          Write-Host "Expected CRT redist dir:"
          Write-Host $expectedDir

          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host $_ }

          New-Item -ItemType Directory -Force $expectedDir | Out-Null

          foreach ($dll in $requiredDlls) {
            $source = Get-ChildItem -Path $searchRoots -Recurse -Filter $dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT\\" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $source) {
              Write-Host "Available CRT directories:"
              Get-ChildItem -Path $searchRoots -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT$" } |
                Select-Object FullName

              throw "Required CRT DLL was not found: $dll"
            }

            $destination = Join-Path $expectedDir $dll
            Copy-Item $source.FullName $destination -Force
            Write-Host "Copied $dll"
            Write-Host "  from: $($source.FullName)"
            Write-Host "  to:   $destination"
          }

          Write-Host "Prepared CRT redist directory:"
          Get-ChildItem $expectedDir | Select-Object FullName

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build package

      - name: upload Mozc64_x64.msi
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_x64.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: warn

  build_universal:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@v6
        with:
          name: daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Prepare CRT redist directory expected by WiX
        shell: pwsh
        run: |
          $expectedDir = "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"

          $requiredDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\17",
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\17",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          ) | Where-Object { Test-Path $_ }

          Write-Host "Expected CRT redist dir:"
          Write-Host $expectedDir

          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host $_ }

          New-Item -ItemType Directory -Force $expectedDir | Out-Null

          foreach ($dll in $requiredDlls) {
            $source = Get-ChildItem -Path $searchRoots -Recurse -Filter $dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT\\" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $source) {
              Write-Host "Available CRT directories:"
              Get-ChildItem -Path $searchRoots -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT$" } |
                Select-Object FullName

              throw "Required CRT DLL was not found: $dll"
            }

            $destination = Join-Path $expectedDir $dll
            Copy-Item $source.FullName $destination -Force
            Write-Host "Copied $dll"
            Write-Host "  from: $($source.FullName)"
            Write-Host "  to:   $destination"
          }

          Write-Host "Prepared CRT redist directory:"
          Get-ChildItem $expectedDir | Select-Object FullName

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --config win_universal_installer package

      - name: upload Mozc64_universal.msi
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_universal.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: warn

  build_arm64:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@v6
        with:
          name: daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Prepare CRT redist directory expected by WiX
        shell: pwsh
        run: |
          $expectedDir = "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"

          $requiredDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\17",
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\17",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          ) | Where-Object { Test-Path $_ }

          Write-Host "Expected CRT redist dir:"
          Write-Host $expectedDir

          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host $_ }

          New-Item -ItemType Directory -Force $expectedDir | Out-Null

          foreach ($dll in $requiredDlls) {
            $source = Get-ChildItem -Path $searchRoots -Recurse -Filter $dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT\\" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $source) {
              Write-Host "Available CRT directories:"
              Get-ChildItem -Path $searchRoots -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT$" } |
                Select-Object FullName

              throw "Required CRT DLL was not found: $dll"
            }

            $destination = Join-Path $expectedDir $dll
            Copy-Item $source.FullName $destination -Force
            Write-Host "Copied $dll"
            Write-Host "  from: $($source.FullName)"
            Write-Host "  to:   $destination"
          }

          Write-Host "Prepared CRT redist directory:"
          Get-ChildItem $expectedDir | Select-Object FullName

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build

      - name: upload Mozc64_arm64.msi
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: warn

  build_arm64_lifecycle_baseline:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    # Preserve the pre-split W2 baseline semantics: prepare the environment
    # from the current source, run the current ARM64 build once to warm the
    # same Bazel workspace/output-base, then checkout the immutable baseline.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@v6
        with:
          name: daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build Qt (arm64)
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license --target_arch=arm64

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Prepare CRT redist directory expected by WiX
        shell: pwsh
        run: |
          $expectedDir = "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"

          $requiredDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\17",
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\17",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          ) | Where-Object { Test-Path $_ }

          Write-Host "Expected CRT redist dir:"
          Write-Host $expectedDir

          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host $_ }

          New-Item -ItemType Directory -Force $expectedDir | Out-Null

          foreach ($dll in $requiredDlls) {
            $source = Get-ChildItem -Path $searchRoots -Recurse -Filter $dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT\\" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $source) {
              Write-Host "Available CRT directories:"
              Get-ChildItem -Path $searchRoots -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC[0-9]+\.CRT$" } |
                Select-Object FullName

              throw "Required CRT DLL was not found: $dll"
            }

            $destination = Join-Path $expectedDir $dll
            Copy-Item $source.FullName $destination -Force
            Write-Host "Copied $dll"
            Write-Host "  from: $($source.FullName)"
            Write-Host "  to:   $destination"
          }

          Write-Host "Prepared CRT redist directory:"
          Get-ChildItem $expectedDir | Select-Object FullName

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build --platforms=//:windows-arm64

      - name: Verify x64-host current ARM64 parity MSI before baseline checkout
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") {
            throw "Cross-parity warm-up source mismatch: $head"
          }

          $msi = ".\src\bazel-bin\win32\installer\Mozc64.msi"
          if (-not (Test-Path $msi -PathType Leaf)) {
            throw "Current-source x64-host ARM64 warm-up MSI was not produced."
          }

          Write-Host "Cross-parity source SHA = $head"
          Write-Host "Cross-parity MSI SHA256 = $((Get-FileHash $msi -Algorithm SHA256).Hash)"

      - name: upload x64-host current ARM64 parity MSI
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_x64_cross_parity.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: error
          retention-days: 3

      - name: Build W2-predecessor ARM64 lifecycle baseline
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $baseline = "c986db2c611c7255ba92b1d44fc6ac3fb6b098bf"
          $tracked = @(git status --porcelain --untracked-files=no)
          if ($tracked.Count -ne 0) {
            throw "Tracked working tree changed during current ARM64 build: $($tracked -join '; ')"
          }

          # actions/checkout fetches only the triggering commit by default.
          # Fetch the immutable audited W2-predecessor commit explicitly.
          git fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch exact W2-predecessor baseline commit."
          }

          $fetchedBaseline = (git rev-parse FETCH_HEAD).Trim()
          if ($fetchedBaseline -ne $baseline) {
            throw "Fetched W2-predecessor baseline mismatch: $fetchedBaseline"
          }

          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout fetched W2-predecessor baseline."
          }

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $baseline) {
            throw "Baseline checkout mismatch: $actual"
          }

          Push-Location .\src
          try {
            bazelisk build package --config release_build --platforms=//:windows-arm64
            if ($LASTEXITCODE -ne 0) {
              throw "W2-predecessor ARM64 baseline build failed."
            }
          }
          finally {
            Pop-Location
          }

          $baselineMsi = ".\src\bazel-bin\win32\installer\Mozc64.msi"
          if (-not (Test-Path $baselineMsi -PathType Leaf)) {
            throw "Baseline MSI was not produced."
          }

          Write-Host "Baseline commit = $actual"
          Write-Host "Baseline MSI SHA256 = $((Get-FileHash $baselineMsi -Algorithm SHA256).Hash)"

      - name: upload Mozc64_arm64 W2-predecessor lifecycle baseline
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_pre_native_lifecycle_baseline.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: error

  test_arm64_cross_native_parity:
    name: ARM64 cross/native package parity audit
    needs:
      - build_arm64
      - build_arm64_lifecycle_baseline
    runs-on: windows-11-arm
    timeout-minutes: 20

    steps:
      - name: Checkout parity audit script
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Download native ARM64 MSI
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64.msi
          path: ${{ runner.temp }}\mozkey-native-arm64-parity

      - name: Download x64-host cross-built ARM64 MSI
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64_x64_cross_parity.msi
          path: ${{ runner.temp }}\mozkey-cross-arm64-parity

      - name: Compare native and x64-host cross ARM64 package contracts
        shell: pwsh
        run: |
          & ".\.github\scripts\windows_arm64_cross_native_parity_audit.ps1" `
            -NativeArtifactDir "${{ runner.temp }}\mozkey-native-arm64-parity" `
            -CrossArtifactDir "${{ runner.temp }}\mozkey-cross-arm64-parity" `
            -EvidenceDir "${{ runner.temp }}\mozkey-arm64-cross-native-parity-evidence"

      - name: Upload cross/native parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_cross_native_parity_audit
          path: ${{ runner.temp }}\mozkey-arm64-cross-native-parity-evidence
          if-no-files-found: warn
          retention-days: 7

  test_arm64_installer_lifecycle:
    name: Native ARM64 installer lifecycle audit
    needs:
      - build_arm64
      - build_arm64_lifecycle_baseline
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Checkout current lifecycle audit script
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Download current ARM64 MSI
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64.msi
          path: ${{ runner.temp }}\mozkey-current-arm64-msi

      - name: Download W2-predecessor ARM64 MSI
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64_pre_native_lifecycle_baseline.msi
          path: ${{ runner.temp }}\mozkey-baseline-arm64-msi

      - name: Run native ARM64 installer lifecycle audit
        shell: pwsh
        run: |
          & ".\.github\scripts\windows_zenz_arm64_installer_lifecycle_audit.ps1" `
            -BaselineArtifactDir "${{ runner.temp }}\mozkey-baseline-arm64-msi" `
            -CurrentArtifactDir "${{ runner.temp }}\mozkey-current-arm64-msi" `
            -EvidenceDir "${{ runner.temp }}\mozkey-w6-arm64-lifecycle-evidence"

      - name: Upload installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_arm64_installer_lifecycle_audit
          path: ${{ runner.temp }}\mozkey-w6-arm64-lifecycle-evidence
          if-no-files-found: warn

  test_arm64_installed_msi:
    name: Native ARM64 installed MSI Zenz audit
    needs: build_arm64
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Download exact ARM64 MSI from this workflow run
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_arm64.msi
          path: ${{ runner.temp }}\mozkey-arm64-msi

      - name: Install and audit exact ARM64 MSI
        shell: pwsh
        env:
          EXPECTED_LLAMA_SHA256: 0ACD17D6EE5E361AFC06A7DCCD06EF012A00669546535889B874D5C3BB3DE81B
          EXPECTED_MODEL_SHA256: 29C223D4C23327B80FD13EBB5AB2555057A46317997D5DA391584FFBEF0DB673
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $evidence = Join-Path $env:RUNNER_TEMP "mozkey-w4-arm64-msi-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $msiCandidates = @(
            Get-ChildItem (Join-Path $env:RUNNER_TEMP "mozkey-arm64-msi") -Recurse -File -Filter *.msi
          )
          if ($msiCandidates.Count -ne 1) {
            throw "Expected exactly one ARM64 MSI artifact; found $($msiCandidates.Count)"
          }
          $msi = $msiCandidates[0].FullName
          $msiSha = (Get-FileHash $msi -Algorithm SHA256).Hash

          Write-Host "Runner architecture = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "MSI                 = $msi"
          Write-Host "MSI SHA256          = $msiSha"

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job is not running on native Windows ARM64."
          }

          # installer_oss_64bit.wxs currently uses ProgramFilesFolder, not
          # ProgramFiles64Folder.  On 64-bit Windows, Windows Installer maps
          # ProgramFilesFolder to the 32-bit Program Files location.  Do not
          # hard-code either location here; discover the exact installed path.
          $installDir = $null

          $programRoots = @(
            [Environment]::GetEnvironmentVariable("ProgramFiles")
            [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
            [Environment]::GetEnvironmentVariable("ProgramW6432")
          ) |
            Where-Object { $_ } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_).TrimEnd("\") } |
            Select-Object -Unique

          $installCandidates = @(
            $programRoots | ForEach-Object { Join-Path $_ "Mozc" }
          )

          Write-Host "Program roots:"
